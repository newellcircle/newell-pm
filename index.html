function parseRoute() {
  const h = (window.location.hash.slice(1)||'/').split('?')[0]
  const m1 = h.match(/^\/clients\/([^/]+)\/kanban$/)
  if (m1) return {view:'kanban',  clientId:m1[1]}
  const m2 = h.match(/^\/dashboard\/([^/]+)$/)
  if (m2) return {view:'dashboard',shareToken:m2[1]}
  if (h==='/login') return {view:'login'}
  return {view:'overview'}
}
const navigate = path => { window.location.hash = path }

const AuthCtx = createContext(null)
const useAuth = () => useContext(AuthCtx)

function AuthProvider({children}) {
  const [session, setSession] = useState(undefined)
  useEffect(()=>{
    db.auth.getSession().then(({data})=>setSession(data.session))
    const {data:{subscription}} = db.auth.onAuthStateChange((_,s)=>setSession(s))
    return ()=>subscription.unsubscribe()
  },[])
  return <AuthCtx.Provider value={{session,loading:session===undefined}}>{children}</AuthCtx.Provider>
}

// ââ Client Card ââââââââââââââââââââââââââââââââââââââââââââââââââ
function ClientCard({client,tasks,onClick}) {
  const counts = {queued:0,in_progress:0,under_review:0,done:0}
  let latest = null
  for (const t of tasks) {
    counts[t.status]=(counts[t.status]||0)+1
    const d = new Date(t.updated_at)
    if (!latest||d>latest) latest=d
  }
  const touch  = latest||new Date(client.created_at)
  const days   = daysSince(touch)
  const alert  = days>=7?'red':days>=4?'yellow':'ok'
  const border = alert==='red'  ? 'border-l-4 border-l-red-400 bg-red-50/40'
               : alert==='yellow'? 'border-l-4 border-l-yellow-400 bg-yellow-50/40' : ''

  return (
    <button onClick={onClick}
      className={`w-full text-left bg-white rounded-2xl border border-gray-100 shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all p-5 ${border}`}>
      <div className="flex items-start gap-3 mb-4">
        <div className="w-10 h-10 rounded-xl flex items-center justify-center text-white text-sm font-bold shrink-0"
          style={{backgroundColor:client.color||'#154579'}}>
          {client.name.slice(0,2).toUpperCase()}
        </div>
        <div className="flex-1 min-w-0">
          <h3 className="font-semibold text-gray-900 truncate">{client.name}</h3>
          <p className="text-xs mt-0.5">
            {alert==='red'    && <span className="text-red-500 font-medium">â  {days}d since last touch</span>}
            {alert==='yellow' && <span className="text-yellow-600 font-medium">â¡ {days}d since last touch</span>}
            {alert==='ok'     && <span className="text-green-600">â Active</span>}
          </p>
        </div>
      </div>
      <div className="grid grid-cols-4 gap-2 text-center">
        {STATUS.map(s=>(
          <div key={s.key}>
            <div className={`text-lg font-bold ${counts[s.key]>0?'text-gray-900':'text-gray-300'}`}>{counts[s.key]}</div>
            <div className="text-xs text-gray-400 leading-tight mt-0.5">{s.label.split(' ')[0]}</div>
          </div>
        ))}
      </div>
    </button>
  )
}

  const [title,setTitle]           = useState(task.title)
  const [status,setStatus]         = useState(task.status)
  const [dueDate,setDueDate]       = useState(task.due_date||'')
  const [eta,setEta]               = useState(task.eta||'')
  const [description,setDescription] = useState(task.description||'')
  const [history,setHistory]       = useState([])
  const [attachments,setAttachments] = useState([])
  const [noteText,setNoteText]     = useState('')
  const [saving,setSaving]         = useState(false)
  const [uploading,setUploading]   = useState(false)
  const [deleting,setDeleting]     = useState(false)
  const fileRef = useRef(null)
  const origRef = useRef({status:task.status,description:task.description||''})

  const isDirty = title!==task.title||status!==task.status||dueDate!==(task.due_date||'')||eta!==(task.eta||'')||description!==(task.description||'')

  useEffect(()=>{fetchHistory();fetchAttachments()},[task.id])

  async function fetchHistory()     { const {data}=await db.from('task_history').select('*').eq('task_id',task.id).order('created_at',{ascending:false}); setHistory(data||[]) }
  async function fetchAttachments() { const {data}=await db.from('task_attachments').select('*').eq('task_id',task.id).order('created_at',{ascending:false}); setAttachments(data||[]) }

  async function handleSave() {
    setSaving(true)
    const entries=[]
    if (status!==origRef.current.status)       entries.push({task_id:task.id,field:'status',old_value:origRef.current.status,new_value:status})
    if (description!==origRef.current.description) entries.push({task_id:task.id,field:'description',old_value:origRef.current.description||null,new_value:description||null,note:'Description updated'})
    const {data:updated,error} = await db.from('tasks').update({title:title.trim(),status,due_date:dueDate||null,eta:eta.trim()||null,description:description.trim()||null}).eq('id',task.id).select().single()
    if (!error&&updated) {
      if (entries.length) await db.from('task_history').insert(entries)
      origRef.current={status,description}
      onUpdate(updated); fetchHistory()
    }
    setSaving(false)
  }

  async function handleAddNote() {
    if (!noteText.trim()) return
    await db.from('task_history').insert({task_id:task.id,field:'note',note:noteText.trim()})
    const {data:u} = await db.from('tasks').update({updated_at:new Date().toISOString()}).eq('id',task.id).select().single()
    if (u) onUpdate(u)
    setNoteText(''); fetchHistory()
  }

  async function handleUpload(e) {
    const files=Array.from(e.target.files||[]); if (!files.length) return
    setUploading(true)
    for (const file of files) {
      const path=`${task.id}/${Date.now()}-${file.name}`
      const {error} = await db.storage.from('attachments').upload(path,file)
      if (!error) {
        await db.from('task_attachments').insert({task_id:task.id,file_name:file.name,file_path:path,file_size:file.size})
        await db.from('task_history').insert({task_id:task.id,field:'attachment',new_value:file.name,note:`File attached: ${file.name}`})
      }
    }
    fetchAttachments(); fetchHistory()
    if (fileRef.current) fileRef.current.value=''
    setUploading(false)
  }

  async function handleDeleteAttachment(att) {
    await db.storage.from('attachments').remove([att.file_path])
    await db.from('task_attachments').delete().eq('id',att.id)
    fetchAttachments()
  }

  async function handleDeleteTask() {
    if (!window.confirm(`Delete "${task.title}"? This cannot be undone.`)) return
    setDeleting(true)
    await db.from('tasks').delete().eq('id',task.id)
    onDelete(task.id)
  }
