// ââ Hash Router ââââââââââââââââââââââââââââââââââââââââââââââââââ
function parseRoute() {
  const h = (window.location.hash.slice(1)||'/').split('?')[0]
  const m1 = h.match(/^\/clients\/([^/]+)\/kanban$/)
  if (m1) return {view:'kanban',  clientId:m1[1]}
  const m2 = h.match(/^\/dashboard\/([^/]+)$/)
  if (m2) return {view:'dashboard',shareToken:m2[1]}
  if (h==='/login') return {view:'login'}
  return {view:'overview'}
}
const navigate = path => { window.location.hash = path }

// ââ Auth Context âââââââââââââââââââââââââââââââââââââââââââââââââ
const AuthCtx = createContext(null)
const useAuth = () => useContext(AuthCtx)

function AuthProvider({children}) {
  const [session, setSession] = useState(undefined)
  useEffect(()=>{
    db.auth.getSession().then(({data})=>setSession(data.session))
    const {data:{subscription}} = db.auth.onAuthStateChange((_,s)=>setSession(s))
    return ()=>subscription.unsubscribe()
  },[])
  return <AuthCtx.Provider value={{session,loading:session===undefined}}>{children}</AuthCtx.Provider>
}

// ââ Client Card ââââââââââââââââââââââââââââââââââââââââââââââââââ
function ClientCard({client,tasks,onClick}) {
  const counts = {queued:0,in_progress:0,under_review:0,done:0}
  let latest = null
  for (const t of tasks) {
    counts[t.status]=(counts[t.status]||0)+1
    const d = new Date(t.updated_at)
    if (!latest||d>latest) latest=d
  }
  const touch  = latest||new Date(client.created_at)
  const days   = daysSince(touch)
  const alert  = days>=7?'red':days>=4?'yellow':'ok'
  const border = alert==='red'  ? 'border-l-4 border-l-red-400 bg-red-50/40'
               : alert==='yellow'? 'border-l-4 border-l-yellow-400 bg-yellow-50/40' : ''

  return (
    <button onClick={onClick}
      className={`w-full text-left bg-white rounded-2xl border border-gray-100 shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all p-5 ${border}`}>
      <div className="flex items-start gap-3 mb-4">
        <div className="w-10 h-10 rounded-xl flex items-center justify-center text-white text-sm font-bold shrink-0"
          style={{backgroundColor:client.color||'#154579'}}>
          {client.name.slice(0,2).toUpperCase()}
        </div>
        <div className="flex-1 min-w-0">
          <h3 className="font-semibold text-gray-900 truncate">{client.name}</h3>
          <p className="text-xs mt-0.5">
            {alert==='red'    && <span className="text-red-500 font-medium">â  {days}d since last touch</span>}
            {alert==='yellow' && <span className="text-yellow-600 font-medium">â¡ {days}d since last touch</span>}
            {alert==='ok'     && <span className="text-green-600">â Active</span>}
          </p>
        </div>
      </div>
      <div className="grid grid-cols-4 gap-2 text-center">
        {STATUS.map(s=>(
          <div key={s.key}>
            <div className={`text-lg font-bold ${counts[s.key]>0?'text-gray-900':'text-gray-300'}`}>{counts[s.key]}</div>
            <div className="text-xs text-gray-400 leading-tight mt-0.5">{s.label.split(' ')[0]}</div>
          </div>
        ))}
      </div>
    </button>
  )
}

// ââ Overview Page ââââââââââââââââââââââââââââââââââââââââââââââââ
function OverviewPage() {
  const [clients,setClients] = useState([])
  const [tasks,setTasks]     = useState([])

  const [showAdd,setShowAdd] = useState(false)

  async function fetchData() {
    setLoading(true)
    const [{data:c},{data:t}] = await Promise.all([
      db.from('clients').select('*').order('name'),
      db.from('tasks').select('id,client_id,status,updated_at'),
    ])
    setClients(c||[]); setTasks(t||[]); setLoading(false)
  }
  useEffect(()=>{fetchData()},[])

  const sorted = [...clients].sort((a,b)=>{
    const latA = tasks.filter(t=>t.client_id===a.id).reduce((m,t)=>Math.max(m,new Date(t.updated_at).getTime()),new Date(a.created_at).getTime())
    const latB = tasks.filter(t=>t.client_id===b.id).reduce((m,t)=>Math.max(m,new Date(t.updated_at).getTime()),new Date(b.created_at).getTime())
    const dA=daysSince(new Date(latA)), dB=daysSince(new Date(latB))
    const lvl=d=>d>=7?0:d>=4?1:2
    return lvl(dA)-lvl(dB)||dB-dA
  })

  return (
    <div className="max-w-7xl mx-auto px-4 sm:px-6 py-8">
      <div className="flex items-center justify-between mb-6">
        <div>
          <h1 className="text-2xl font-bold text-gray-900">Clients</h1>
          <p className="text-sm text-gray-500 mt-0.5">{clients.length} client{clients.length!==1?'s':''} Â· Click any card to open the kanban board</p>
        </div>
        <button onClick={()=>setShowAdd(true)}
          className="inline-flex items-center gap-2 px-4 py-2 bg-[#154579] text-white text-sm font-medium rounded-lg hover:bg-[#0f3560] transition-colors">
          <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}><path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4"/></svg>
          Add Client
        </button>
      </div>

      <div className="flex flex-wrap items-center gap-4 mb-6 text-xs text-gray-500">
        <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded-full bg-green-400"/>Within 3 days</span>
        <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded bg-yellow-400"/>4â6 days</span>
        <span className="flex items-center gap-1.5"><span className="w-3 h-3 rounded bg-red-400"/>7+ days â needs attention</span>
      </div>

      {loading ? (
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          {[...Array(6)].map((_,i)=><div key={i} className="h-40 bg-white rounded-2xl border border-gray-100 animate-pulse"/>)}
        </div>
      ) : sorted.length===0 ? (
        <div className="text-center py-24">
          <p className="font-medium text-gray-500 text-lg">No clients yet</p>
          <p className="text-sm text-gray-400 mt-1 mb-4">Add your first client to get started.</p>
          <button onClick={()=>setShowAdd(true)} className="inline-flex items-center gap-2 px-4 py-2 bg-[#154579] text-white text-sm font-medium rounded-lg hover:bg-[#0f3560]">
            <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}><path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4"/></svg>
            Add Client
          </button>
        </div>
      ) : (
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          {sorted.map(c=>(
            <ClientCard key={c.id} client={c} tasks={tasks.filter(t=>t.client_id===c.id)}
              onClick={()=>navigate(`/clients/${c.id}/kanban`)}/>
          ))}
        </div>
      )}

      {showAdd && <AddClientModal onClose={()=>setShowAdd(false)} onCreated={c=>{setClients(p=>[...p,c]);setShowAdd(false)}}/>}
    </div>
  )
}

// ââ Task Card ââââââââââââââââââââââââââââââââââââââââââââââââââââ

  return (
    <div
      draggable
      onDragStart={e=>{e.dataTransfer.setData('taskId',task.id);e.dataTransfer.setData('fromStatus',task.status);onDragStart?.()}}
      onDragEnd={()=>onDragEnd?.()}
      onClick={onClick}

    >
      <p className="text-sm font-medium text-gray-900 leading-snug group-hover:text-[#154579] transition-colors">{task.title}</p>

        <p className={`text-xs mt-2 font-medium ${isOverdue(task.due_date)?'text-red-500':'text-gray-400'}`}>

      {task.eta&&!task.due_date&&<p className="text-xs text-gray-400 mt-1.5">ETA: {task.eta}</p>}
    </div>
  )
}

// ââ Task Modal âââââââââââââââââââââââââââââââââââââââââââââââââââ
function TaskModal({task,onClose,onUpdate,onDelete}) {
  const [title,setTitle]           = useState(task.title)
  const [status,setStatus]         = useState(task.status)
  const [dueDate,setDueDate]       = useState(task.due_date||'')
  const [eta,setEta]               = useState(task.eta||'')
  const [description,setDescription] = useState(task.description||'')
  const [history,setHistory]       = useState([])
  const [attachments,setAttachments] = useState([])
  const [noteText,setNoteText]     = useState('')
  const [saving,setSaving]         = useState(false)
  const [uploading,setUploading]   = useState(false)
  const [deleting,setDeleting]     = useState(false)
  const fileRef = useRef(null)
  const origRef = useRef({status:task.status,description:task.description||''})

  const isDirty = title!==task.title||status!==task.status||dueDate!==(task.due_date||'')||eta!==(task.eta||'')||description!==(task.description||'')

  useEffect(()=>{fetchHistory();fetchAttachments()},[task.id])

  async function fetchHistory()     { const {data}=await db.from('task_history').select('*').eq('task_id',task.id).order('created_at',{ascending:false}); setHistory(data||[]) }
  async function fetchAttachments() { const {data}=await db.from('task_attachments').select('*').eq('task_id',task.id).order('created_at',{ascending:false}); setAttachments(data||[]) }

  async function handleSave() {
    setSaving(true)
    const entries=[]
    if (status!==origRef.current.status)       entries.push({task_id:task.id,field:'status',old_value:origRef.current.status,new_value:status})
    if (description!==origRef.current.description) entries.push({task_id:task.id,field:'description',old_value:origRef.current.description||null,new_value:description||null,note:'Description updated'})
    const {data:updated,error} = await db.from('tasks').update({title:title.trim(),status,due_date:dueDate||null,eta:eta.trim()||null,description:description.trim()||null}).eq('id',task.id).select().single()
    if (!error&&updated) {
      if (entries.length) await db.from('task_history').insert(entries)
      origRef.current={status,description}
      onUpdate(updated); fetchHistory()
    }
    setSaving(false)
  }

  async function handleAddNote() {
    if (!noteText.trim()) return
    await db.from('task_history').insert({task_id:task.id,field:'note',note:noteText.trim()})
    const {data:u} = await db.from('tasks').update({updated_at:new Date().toISOString()}).eq('id',task.id).select().single()
    if (u) onUpdate(u)
    setNoteText(''); fetchHistory()
  }

  async function handleUpload(e) {
    const files=Array.from(e.target.files||[]); if (!files.length) return
    setUploading(true)
    for (const file of files) {
      const path=`${task.id}/${Date.now()}-${file.name}`
      const {error} = await db.storage.from('attachments').upload(path,file)
      if (!error) {
        await db.from('task_attachments').insert({task_id:task.id,file_name:file.name,file_path:path,file_size:file.size})
        await db.from('task_history').insert({task_id:task.id,field:'attachment',new_value:file.name,note:`File attached: ${file.name}`})
      }
    }
    fetchAttachments(); fetchHistory()
    if (fileRef.current) fileRef.current.value=''
    setUploading(false)
  }

  async function handleDeleteAttachment(att) {
    await db.storage.from('attachments').remove([att.file_path])
    await db.from('task_attachments').delete().eq('id',att.id)
    fetchAttachments()
  }

  async function handleDeleteTask() {
    if (!window.confirm(`Delete "${task.title}"? This cannot be undone.`)) return
    setDeleting(true)
    await db.from('tasks').delete().eq('id',task.id)
    onDelete(task.id)
  }

  function getStorageUrl(path) { const {data}=db.storage.from('attachments').getPublicUrl(path); return data.publicUrl }

  function HistoryEntry({entry}) {
    if (entry.field==='note') return (
      <div className="flex gap-3">
        <div className="w-6 h-6 rounded-full bg-blue-100 flex items-center justify-center shrink-0 mt-0.5">
          <svg className="w-3 h-3 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}><path strokeLinecap="round" strokeLinejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
        </div>
        <div className="flex-1">
          <p className="text-sm text-gray-700 bg-blue-50 rounded-xl px-3 py-2">{entry.note}</p>
          <p className="text-xs text-gray-400 mt-1 ml-1">{fmt(entry.created_at)}</p>
        </div>
      </div>
    )
    if (entry.field==='status') {
      const oC=statusCfg(entry.old_value), nC=statusCfg(entry.new_value)
      return (
        <div className="flex gap-3 items-start">
          <div className="w-6 h-6 rounded-full bg-gray-100 flex items-center justify-center shrink-0 mt-0.5">
            <svg className="w-3 h-3 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}><path strokeLinecap="round" strokeLinejoin="round" d="M9 5l7 7-7 7"/></svg>
          </div>
          <div>
            <p className="text-xs text-gray-500 flex flex-wrap items-center gap-1">
              Status changed
              {entry.old_value&&<><span>from</span><span className={`px-1.5 py-0.5 rounded text-xs font-medium ${oC.badge}`}>{oC.label}</span></>}
              <span>to</span><span className={`px-1.5 py-0.5 rounded text-xs font-medium ${nC.badge}`}>{nC.label}</span>
            </p>
            <p className="text-xs text-gray-400 mt-0.5">{fmt(entry.created_at)}</p>
          </div>
        </div>
      )
    }
    if (entry.field==='attachment') return (
      <div className="flex gap-3 items-start">
        <div className="w-6 h-6 rounded-full bg-purple-50 flex items-center justify-center shrink-0 mt-0.5">
          <svg className="w-3 h-3 text-purple-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}><path strokeLinecap="round" strokeLinejoin="round" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/></svg>
        </div>
        <div><p className="text-xs text-gray-500">{entry.note}</p><p className="text-xs text-gray-400 mt-0.5">{fmt(entry.created_at)}</p></div>
      </div>
    )
    return (
      <div className="flex gap-3 items-start">
        <div className="w-6 h-6 rounded-full bg-gray-100 flex items-center justify-center shrink-0 mt-0.5">
          <svg className="w-3 h-3 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
        </div>
        <div><p className="text-xs text-gray-500">{entry.note||`${entry.field} updated`}</p><p className="text-xs text-gray-400 mt-0.5">{fmt(entry.created_at)}</p></div>
      </div>
    )
  }

  const cfg=statusCfg(status)
  return (
    <>
      <div className="fixed inset-0 bg-black/30 z-40 modal-backdrop" onClick={isDirty?undefined:onClose}/>
      <div className="fixed right-0 top-0 bottom-0 w-full max-w-xl bg-white shadow-2xl z-50 flex flex-col modal-panel">
        <div className="flex items-center justify-between px-6 py-4 border-b border-gray-100 shrink-0">
          <span className={`text-xs font-semibold px-2.5 py-1 rounded-full ${cfg.badge}`}>{cfg.label}</span>
          <div className="flex items-center gap-2">
            {isDirty&&<button onClick={handleSave} disabled={saving} className="px-3 py-1.5 bg-[#154579] text-white text-xs font-medium rounded-lg hover:bg-[#0f3560] disabled:opacity-50">{saving?'Savingâ¦':'Save changes'}</button>}
            <button onClick={isDirty?()=>{if(window.confirm('Discard unsaved changes?'))onClose()}:onClose} className="p-1.5 text-gray-400 hover:text-gray-600 rounded-lg hover:bg-gray-100">
              <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
          </div>
        </div>

        <div className="flex-1 overflow-y-auto">
          <div className="px-6 py-5 space-y-5">
            <textarea value={title} onChange={e=>setTitle(e.target.value)} rows={2}
              className="w-full text-xl font-bold text-gray-900 resize-none border-0 p-0 focus:outline-none bg-transparent leading-tight" placeholder="Task titleâ¦"/>

            <div className="grid grid-cols-3 gap-3">
              {[
                {label:'Status', content:<select value={status} onChange={e=>setStatus(e.target.value)} className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#154579]/30 focus:border-[#154579]">{STATUS.map(s=><option key={s.key} value={s.key}>{s.label}</option>)}</select>},
                {label:'Due Date', content:<input type="date" value={dueDate} onChange={e=>setDueDate(e.target.value)} className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#154579]/30 focus:border-[#154579]"/>},
                {label:'ETA', content:<input type="text" value={eta} onChange={e=>setEta(e.target.value)} placeholder="e.g. 2 weeks" className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#154579]/30 focus:border-[#154579]"/>},
              ].map(({label,content})=>(
                <div key={label}><label className="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">{label}</label>{content}</div>
              ))}
            </div>

            <div>
              <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Notes / Description</label>
              <textarea value={description} onChange={e=>setDescription(e.target.value)} rows={5} placeholder="Add notes, context, or detailsâ¦"
                className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#154579]/30 focus:border-[#154579] resize-none"/>
            </div>

            <div>
              <div className="flex items-center justify-between mb-2">
                <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wider">Attachments</label>
                <button type="button" onClick={()=>fileRef.current?.click()} disabled={uploading}
                  className="inline-flex items-center gap-1.5 text-xs text-gray-500 hover:text-[#154579] font-medium">
                  {uploading?'Uploadingâ¦':<><svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}><path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>Upload</>}
                </button>
                <input ref={fileRef} type="file" multiple className="hidden" onChange={handleUpload}/>
              </div>
              {attachments.length===0
                ? <div onClick={()=>fileRef.current?.click()} className="border-2 border-dashed border-gray-200 rounded-xl py-5 text-center cursor-pointer hover:border-gray-300 transition-colors"><p className="text-xs text-gray-400">No attachments Â· Click to upload</p></div>
                : <div className="space-y-2">{attachments.map(att=>(
                    <div key={att.id} className="flex items-center gap-3 bg-gray-50 rounded-lg px-3 py-2.5">
                      <svg className="w-4 h-4 text-gray-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/></svg>
                      <div className="flex-1 min-w-0">
                        <a href={getStorageUrl(att.file_path)} target="_blank" rel="noopener noreferrer" className="text-sm font-medium text-[#154579] hover:underline truncate block">{att.file_name}</a>
                        {att.file_size&&<p className="text-xs text-gray-400">{fmtSize(att.file_size)}</p>}
                      </div>
                      <button onClick={()=>handleDeleteAttachment(att)} className="text-gray-400 hover:text-red-500 transition-colors shrink-0">
                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                      </button>
                    </div>
                  ))}</div>
              }
            </div>

            <div>
              <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wider mb-3">Activity</label>
              <div className="flex gap-2 mb-4">
                <input type="text" value={noteText} onChange={e=>setNoteText(e.target.value)}
                  onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleAddNote()}}}
                  placeholder="Add a noteâ¦"
                  className="flex-1 px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#154579]/30 focus:border-[#154579]"/>
                <button onClick={handleAddNote} disabled={!noteText.trim()} className="px-3 py-2 bg-[#154579] text-white text-sm font-medium rounded-lg hover:bg-[#0f3560] disabled:opacity-40">Add</button>
              </div>
              {history.length===0
                ? <p className="text-xs text-gray-400 text-center py-4">No activity yet</p>
                : <div className="space-y-4">{history.map(e=><HistoryEntry key={e.id} entry={e}/>)}</div>
              }
            </div>

            <div className="border-t border-gray-100 pt-4 grid grid-cols-2 gap-3 text-xs text-gray-400">
              <div><p className="font-medium text-gray-500 mb-0.5">Created</p><p>{fmt(task.created_at)}</p></div>
              <div><p className="font-medium text-gray-500 mb-0.5">Last updated</p><p>{fmt(task.updated_at)}</p></div>
            </div>

            <div className="border-t border-gray-100 pt-4">
              <button onClick={handleDeleteTask} disabled={deleting} className="text-xs text-red-400 hover:text-red-600 transition-colors">
                {deleting?'Deletingâ¦':'Delete this task'}
              </button>
            </div>
          </div>
        </div>

        {isDirty&&(
          <div className="border-t border-gray-100 px-6 py-4 bg-white shrink-0 flex items-center justify-between">
            <p className="text-xs text-gray-400">Unsaved changes</p>
            <div className="flex gap-2">
              <button onClick={()=>{setTitle(task.title);setStatus(task.status);setDueDate(task.due_date||'');setEta(task.eta||'');setDescription(task.description||'')}}
                className="px-3 py-1.5 border border-gray-200 text-sm text-gray-700 rounded-lg hover:bg-gray-50">Discard</button>
              <button onClick={handleSave} disabled={saving} className="px-3 py-1.5 bg-[#154579] text-white text-sm font-medium rounded-lg hover:bg-[#0f3560] disabled:opacity-50">{saving?'Savingâ¦':'Save changes'}</button>
            </div>
          </div>
        )}
      </div>
    </>
  )
}

// ââ Kanban Page ââââââââââââââââââââââââââââââââââââââââââââââââââ
function KanbanPage({clientId}) {
  const [client,setClient]         = useState(null)
  const [tasks,setTasks]           = useState([])
  const [selectedTask,setSelected] = useState(null)
  const [loading,setLoading]       = useState(true)
  const [showAdd,setShowAdd]       = useState(false)
  const [newTitle,setNewTitle]     = useState('')
  const [newStatus,setNewStatus]   = useState('queued')
  const [addLoading,setAddLoading] = useState(false)
  const [dragging,setDragging]     = useState(null)

  useEffect(()=>{
    async function load() {
      const [{data:c},{data:t}] = await Promise.all([
        db.from('clients').select('*').eq('id',clientId).single(),
        db.from('tasks').select('*').eq('client_id',clientId).order('position'),
      ])
      setClient(c); setTasks(t||[]); setLoading(false)
    }
    load()
  },[clientId])

  async function addTask(e) {
    e.preventDefault(); if (!newTitle.trim()) return; setAddLoading(true)
    const maxPos=tasks.filter(t=>t.status===newStatus).reduce((m,t)=>Math.max(m,t.position),-1)
    const {data,error}=await db.from('tasks').insert({client_id:clientId,title:newTitle.trim(),status:newStatus,position:maxPos+1}).select().single()
    if (!error&&data) {
      setTasks(p=>[...p,data])
      await db.from('task_history').insert({task_id:data.id,field:'status',old_value:null,new_value:newStatus,note:'Task created'})
    }
    setNewTitle('');setAddLoading(false);setShowAdd(false)
  }

  async function changeStatus(taskId,newSt,oldSt) {
    setTasks(p=>p.map(t=>t.id===taskId?{...t,status:newSt}:t))
    const {data:u}=await db.from('tasks').update({status:newSt}).eq('id',taskId).select().single()
    if (u) {
      setTasks(p=>p.map(t=>t.id===taskId?u:t))
      if (selectedTask?.id===taskId) setSelected(u)
      await db.from('task_history').insert({task_id:taskId,field:'status',old_value:oldSt,new_value:newSt})
    }
  }

  if (loading) return <div className="flex items-center justify-center h-96"><div className="w-8 h-8 border-2 border-[#154579] border-t-transparent rounded-full animate-spin"/></div>
  if (!client)  return <div className="text-center py-24"><p className="text-gray-500">Client not found.</p><button onClick={()=>navigate('/')} className="text-[#154579] text-sm mt-2 hover:underline">â Back</button></div>

  const shareUrl=`${window.location.origin}${window.location.pathname}#/dashboard/${client.share_token}`

  return (
    <div className="flex flex-col h-[calc(100vh-56px)]">
      <div className="bg-white border-b border-gray-100 px-4 sm:px-6 py-4 flex items-center justify-between gap-4 shrink-0">
        <div className="flex items-center gap-3 min-w-0">
          <button onClick={()=>navigate('/')} className="inline-flex items-center gap-1.5 text-sm text-gray-500 hover:text-gray-900 font-medium shrink-0">
            <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M15 19l-7-7 7-7"/></svg>
            <span className="hidden sm:inline">Clients</span>
          </button>
          <span className="text-gray-300">Â·</span>
          <div className="flex items-center gap-2.5 min-w-0">
            <div className="w-8 h-8 rounded-lg flex items-center justify-center text-white text-xs font-bold shrink-0" style={{backgroundColor:client.color||'#154579'}}>
              {client.name.slice(0,2).toUpperCase()}
            </div>
            <h1 className="font-semibold text-gray-900 truncate">{client.name}</h1>
          </div>
        </div>
        <div className="flex items-center gap-2 shrink-0">
          <button onClick={()=>navigator.clipboard.writeText(shareUrl).then(()=>alert('Client dashboard link copied!'))}
            className="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 text-xs text-gray-500 font-medium rounded-lg hover:bg-gray-100 transition-colors">
            <svg className="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
            Copy client link
          </button>
          <button onClick={()=>setShowAdd(true)} className="inline-flex items-center gap-2 px-4 py-2 bg-[#154579] text-white text-sm font-medium rounded-lg hover:bg-[#0f3560] transition-colors">
            <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}><path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4"/></svg>
            Add Task
          </button>
        </div>
      </div>

      {showAdd&&(
        <div className="bg-blue-50 border-b border-blue-100 px-4 sm:px-6 py-3 shrink-0">
          <form onSubmit={addTask} className="flex items-center gap-3 max-w-2xl">
            <input autoFocus type="text" placeholder="Task titleâ¦" value={newTitle} onChange={e=>setNewTitle(e.target.value)}
              className="flex-1 px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#154579]/30 focus:border-[#154579]"/>
            <select value={newStatus} onChange={e=>setNewStatus(e.target.value)}
              className="w-40 px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#154579]/30 focus:border-[#154579]">
              {STATUS.map(s=><option key={s.key} value={s.key}>{s.label}</option>)}
            </select>
            <button type="submit" disabled={addLoading} className="px-4 py-2 bg-[#154579] text-white text-sm font-medium rounded-lg hover:bg-[#0f3560] disabled:opacity-50 shrink-0">{addLoading?'Addingâ¦':'Add'}</button>
            <button type="button" onClick={()=>setShowAdd(false)} className="px-3 py-2 text-sm text-gray-500 hover:text-gray-900 shrink-0">Cancel</button>
          </form>
        </div>
      )}

      <div className="flex-1 overflow-x-auto overflow-y-hidden">
        <div className="h-full flex gap-4 px-4 sm:px-6 py-4" style={{minWidth:'fit-content'}}>
          {STATUS.map(({key,label,badge,dot})=>{
            const col=tasks.filter(t=>t.status===key)
            return (
              <div key={key} className="flex flex-col w-72 shrink-0 rounded-2xl transition-colors"
                onDragOver={e=>{e.preventDefault();e.currentTarget.classList.add('col-drop-active')}}
                onDragLeave={e=>{if(!e.currentTarget.contains(e.relatedTarget))e.currentTarget.classList.remove('col-drop-active')}}
                onDrop={e=>{
                  e.preventDefault();e.currentTarget.classList.remove('col-drop-active')
                  const id=e.dataTransfer.getData('taskId'),from=e.dataTransfer.getData('fromStatus')
                  if (id&&from!==key) changeStatus(id,key,from)
                  setDragging(null)
                }}>
                <div className={`flex items-center gap-2 px-3 py-2 rounded-xl mb-3 ${badge}`}>
                  <span className={`w-2 h-2 rounded-full ${dot}`}/><span className="font-semibold text-sm">{label}</span>
                  <span className="ml-auto text-xs font-bold opacity-60">{col.length}</span>
                </div>
                <div className="flex flex-col gap-2 flex-1 overflow-y-auto min-h-24 pb-4">
                  {col.map(task=>(
                    <div key={task.id} className={dragging===task.id?'card-dragging':''}>
                      <TaskCard task={task} onClick={()=>setSelected(task)}
                        onDragStart={()=>setDragging(task.id)} onDragEnd={()=>setDragging(null)}/>
                    </div>
                  ))}
                  {col.length===0&&(
                    <div className="flex-1 border-2 border-dashed border-gray-200 rounded-xl flex items-center justify-center min-h-20">
                      <p className="text-xs text-gray-400">Drop tasks here</p>
                    </div>
                  )}
                </div>
              </div>
            )
          })}
        </div>
      </div>

      {selectedTask&&(
        <TaskModal task={selectedTask} onClose={()=>setSelected(null)}
          onUpdate={u=>{setTasks(p=>p.map(t=>t.id===u.id?u:t));if(selectedTask?.id===u.id)setSelected(u)}}
          onDelete={id=>{setTasks(p=>p.filter(t=>t.id!==id));setSelected(null)}}/>
      )}
    </div>
  )
}

// ââ Client Dashboard (public) ââââââââââââââââââââââââââââââââââââ
function ClientDashboard({shareToken}) {
  const [client,setClient]   = useState(null)
  const [tasks,setTasks]     = useState([])
  const [loading,setLoading] = useState(true)
  const [notFound,setNotFound] = useState(false)

  useEffect(()=>{
    async function load() {
      const {data:c,error}=await db.from('clients').select('*').eq('share_token',shareToken).single()
      if (error||!c){setNotFound(true);setLoading(false);return}
      setClient(c)
      const {data:t}=await db.from('tasks').select('*').eq('client_id',c.id).neq('status','done').order('due_date',{ascending:true,nullsFirst:false})
      setTasks(t||[]); setLoading(false)
    }
    load()
  },[shareToken])

  if (loading)  return <div className="min-h-screen bg-white flex items-center justify-center"><div className="w-8 h-8 border-2 border-gray-300 border-t-gray-600 rounded-full animate-spin"/></div>
  if (notFound) return <div className="min-h-screen bg-white flex flex-col items-center justify-center text-center px-4"><h1 className="text-2xl font-bold mb-2">Not found</h1><p className="text-gray-500">This dashboard link doesn't exist or may have expired.</p></div>

  const brand=client.color||'#154579'
  const grouped=STATUS.reduce((acc,s)=>{const items=tasks.filter(t=>t.status===s.key);if(items.length)acc[s.key]=items;return acc},{})

  return (
    <div className="min-h-screen bg-gray-50">
      <div style={{backgroundColor:brand}} className="text-white">
        <div className="max-w-3xl mx-auto px-4 sm:px-6 py-8">
          <div className="flex items-center gap-4">
            <div className="w-14 h-14 bg-white/20 rounded-2xl flex items-center justify-center text-white text-lg font-bold shrink-0">
              {client.name.slice(0,2).toUpperCase()}
            </div>
            <div>
              <p className="text-white/70 text-sm font-medium uppercase tracking-wide">Project Update</p>
              <h1 className="text-2xl font-bold mt-0.5">{client.name}</h1>
            </div>
          </div>
          <div className="flex flex-wrap gap-3 mt-6">
            <div className="bg-white/10 rounded-xl px-4 py-2"><p className="text-white/70 text-xs font-medium">Active Tasks</p><p className="text-white text-xl font-bold">{tasks.length}</p></div>
            {STATUS.filter(s=>s.key!=='done').map(s=>{const n=tasks.filter(t=>t.status===s.key).length;return n?<div key={s.key} className="bg-white/10 rounded-xl px-4 py-2"><p className="text-white/70 text-xs font-medium">{s.label}</p><p className="text-white text-xl font-bold">{n}</p></div>:null})}
          </div>
        </div>
      </div>
      <div className="max-w-3xl mx-auto px-4 sm:px-6 py-8">
        {Object.keys(grouped).length===0?(
          <div className="text-center py-16 bg-white rounded-2xl border border-gray-100">
            <div className="w-12 h-12 bg-green-50 rounded-full flex items-center justify-center mx-auto mb-3">
              <svg className="w-6 h-6 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7"/></svg>
            </div>
            <p className="font-semibold text-gray-900">All caught up!</p>
            <p className="text-sm text-gray-500 mt-1">No active tasks right now.</p>
          </div>
        ):(
          <div className="space-y-8">
            {STATUS.filter(s=>grouped[s.key]).map(s=>(
              <div key={s.key}>
                <div className="flex items-center gap-2 mb-3">
                  <span className={`w-2 h-2 rounded-full ${s.dot}`}/><h2 className="font-semibold text-gray-900 text-sm uppercase tracking-wide">{s.label}</h2><span className="text-gray-400 text-sm">({grouped[s.key].length})</span>
                </div>
                <div className="space-y-2">
                  {grouped[s.key].map(task=>(
                    <div key={task.id} className="bg-white border border-gray-100 rounded-xl px-5 py-4 flex items-start justify-between gap-4 shadow-sm">
                      <div className="min-w-0">
                        <p className="font-medium text-gray-900 leading-snug">{task.title}</p>
                        {task.description&&<p className="text-sm text-gray-500 mt-1 line-clamp-2">{task.description}</p>}
                        {task.eta&&<p className="text-xs text-gray-400 mt-1">ETA: {task.eta}</p>}
                      </div>
                      {task.due_date&&(
                        <div className={`shrink-0 text-right ${isOverdue(task.due_date)?'text-red-600':'text-gray-500'}`}>
                          <p className="text-xs font-medium uppercase tracking-wide">{isOverdue(task.due_date)?'Overdue':'Due'}</p>
                          <p className="text-sm font-semibold mt-0.5">{fmtDate(task.due_date)}</p>
                        </div>
                      )}
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        )}
        <div className="mt-12 text-center text-xs text-gray-400">Powered by Newell Circle Group LLC Â· Read-only view</div>
      </div>
    </div>
  )
}

// ââ App Layout (nav) âââââââââââââââââââââââââââââââââââââââââââââ
function AppLayout({children}) {
  const {session}=useAuth()
  return (
    <div className="min-h-screen bg-gray-50 flex flex-col">
      <header className="bg-[#154579] text-white sticky top-0 z-30">
        <div className="max-w-7xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
          <button onClick={()=>navigate('/')} className="flex items-center gap-2.5 hover:opacity-80 transition-opacity">
            <div className="w-7 h-7 bg-white/20 rounded-lg flex items-center justify-center">
              <svg className="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}><path strokeLinecap="round" strokeLinejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
            </div>
            <span className="font-semibold text-sm tracking-wide">Newell Circle PM</span>
          </button>
          <div className="flex items-center gap-3">
            <span className="text-xs text-white/60 hidden sm:block">{session?.user?.email}</span>
            <button onClick={()=>db.auth.signOut().then(()=>navigate('/login'))}
              className="text-xs text-white/70 hover:text-white border border-white/20 hover:border-white/40 rounded-lg px-3 py-1.5 transition-colors">Sign out</button>
          </div>
        </div>
      </header>
      <main className="flex-1">{children}</main>
    </div>
  )
}

// ââ Auth Gate ââââââââââââââââââââââââââââââââââââââââââââââââââââ
function AuthGate({route}) {
  const {session,loading}=useAuth()
  if (loading) return (
    <div className="min-h-screen flex items-center justify-center bg-gray-50">
      <div className="flex flex-col items-center gap-3">
        <div className="w-8 h-8 border-2 border-[#154579] border-t-transparent rounded-full animate-spin"/>
        <p className="text-sm text-gray-500">Loadingâ¦</p>
      </div>
    </div>
  )
  if (!session) return <LoginPage/>
  return (
    <AppLayout>
      {route.view==='kanban'?<KanbanPage clientId={route.clientId}/>:<OverviewPage/>}
    </AppLayout>
  )
}

// ââ Root âââââââââââââââââââââââââââââââââââââââââââââââââââââââââ
function App() {
  const [route,setRoute]=useState(parseRoute())
  useEffect(()=>{
    const h=()=>setRoute(parseRoute())
    window.addEventListener('hashchange',h)
    return ()=>window.removeEventListener('hashchange',h)
  },[])
  if (route.view==='dashboard') return <ClientDashboard shareToken={route.shareToken}/>
  return <AuthProvider><AuthGate route={route}/></AuthProvider>
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>)
</script>
</body>
